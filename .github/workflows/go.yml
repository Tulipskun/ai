name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Test
        run: |
          set +e
          go test ./... -timeout 2m 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          go vet ./... 2>&1 | tee vet.log
          vet_status=${PIPESTATUS[0]}
          exit $((status != 0 ? status : vet_status))
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-diagnostics
          path: |
            test.log
            vet.log
            go.sum
