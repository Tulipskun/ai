name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest for main builds)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -timeout 2m
      - name: Build (linux arm64 only)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/ai-linux-arm64 ./cmd/ai
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-linux-arm64
          path: dist/ai-linux-arm64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ai-*
          merge-multiple: true
      - name: Prepare release assets
        run: |
          set -euo pipefail
          chmod 0755 dist/ai-linux-arm64
          (cd dist && sha256sum ai-linux-arm64 > checksums.txt)
          cat dist/checksums.txt
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == "latest" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f latest "$SHA"
            git push -f origin latest
            gh release delete latest -y --cleanup-tag || true
            git tag -f latest "$SHA"
            git push -f origin latest
            gh release create latest --latest \
              --title "Latest build (main)" \
              --notes "Automated Linux arm64 build from main @ ${SHA}. Install with: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash" \
              dist/ai-linux-arm64 dist/checksums.txt
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/ai-linux-arm64 dist/checksums.txt
          fi
      - name: Show release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.name }}" --repo "${{ github.repository }}"
