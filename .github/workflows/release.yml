name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: auto-increment v1.N)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -timeout 2m
      - name: Build (linux arm64 only)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/ai-linux-arm64 ./cmd/ai
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-linux-arm64
          path: dist/ai-linux-arm64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ai-*
          merge-multiple: true
      - name: Prepare release assets
        run: |
          set -euo pipefail
          chmod 0755 dist/ai-linux-arm64
          (cd dist && sha256sum ai-linux-arm64 > checksums.txt)
          cat dist/checksums.txt
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            existing="$(git tag --points-at HEAD | grep -E '^v1\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -n "$existing" ]]; then
              echo "name=$existing" >> "$GITHUB_OUTPUT"
            else
              max="$(git tag -l 'v1.*' | sed -E 's/^v1\.//' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
              if [[ -z "$max" ]]; then next=0; else next=$((max + 1)); fi
              echo "name=v1.$next" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$SHA"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
              dist/ai-linux-arm64 dist/checksums.txt
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Automated Linux arm64 build from main @ ${SHA}. Install with: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash" \
              dist/ai-linux-arm64 dist/checksums.txt
          fi
      - name: Show release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.name }}" --repo "${{ github.repository }}"
